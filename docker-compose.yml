services:
  libretranslate:
    container_name: libretranslate
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "5000:5000"  # Optional: Expose for debugging/testing
    volumes:
      - libretranslate_models:/home/libretranslate/.local
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,es,fr,de  # Adjust as needed

  discord-bot:
    build: .
    container_name: discord-translate-bot
    restart: unless-stopped
    depends_on:
      - libretranslate
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    # No ports needed for the bot itself

volumes:
  libretranslate_models:
